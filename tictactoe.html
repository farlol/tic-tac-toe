<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    letter-spacing: 3px;
    color: #e94560;
  }

  #status {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    min-height: 1.8rem;
    color: #a8dadc;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 8px;
  }

  .cell {
    background: #16213e;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
  }

  .cell:hover:not(.taken) {
    background: #0f3460;
    transform: scale(1.04);
  }

  .cell.x { color: #e94560; }
  .cell.o { color: #a8dadc; }

  .cell.win {
    background: #0f3460;
    animation: pulse 0.5s ease;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  #controls {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  button {
    padding: 0.6rem 1.6rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }

  #btn-restart {
    background: #e94560;
    color: #fff;
  }

  #score {
    display: flex;
    gap: 2rem;
    margin-top: 1.5rem;
    font-size: 1rem;
    color: #888;
  }

  .score-item span {
    font-size: 1.4rem;
    font-weight: bold;
    display: block;
    text-align: center;
  }

  .score-item .label { color: #888; }
  .score-item .x-val { color: #e94560; }
  .score-item .o-val { color: #a8dadc; }
  .score-item .d-val { color: #aaa; }
</style>
</head>
<body>

<h1>TIC TAC TOE</h1>
<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="btn-restart">Restart</button>
</div>

<div id="score">
  <div class="score-item">
    <span class="x-val" id="score-x">0</span>
    <span class="label">X Wins</span>
  </div>
  <div class="score-item">
    <span class="d-val" id="score-d">0</span>
    <span class="label">Draws</span>
  </div>
  <div class="score-item">
    <span class="o-val" id="score-o">0</span>
    <span class="label">O Wins</span>
  </div>
</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board, current, over, scores;

  function init() {
    board   = Array(9).fill(null);
    current = 'X';
    over    = false;
    scores  = scores || { X: 0, O: 0, D: 0 };
    render();
  }

  function render() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, i) => {
      cell.textContent = board[i] || '';
      cell.className   = 'cell' + (board[i] ? ` ${board[i].toLowerCase()} taken` : '');
    });
    document.getElementById('status').textContent = over ? '' : `${current}'s turn`;
    document.getElementById('score-x').textContent = scores.X;
    document.getElementById('score-o').textContent = scores.O;
    document.getElementById('score-d').textContent = scores.D;
  }

  function checkWin() {
    for (const [a, b, c] of WINS) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return [a, b, c];
      }
    }
    return null;
  }

  function handleClick(i) {
    if (over || board[i]) return;
    board[i] = current;
    render();

    const win = checkWin();
    if (win) {
      over = true;
      scores[current]++;
      win.forEach(idx => document.querySelectorAll('.cell')[idx].classList.add('win'));
      document.getElementById('status').textContent = `${current} wins!`;
      render();
    } else if (board.every(Boolean)) {
      over = true;
      scores.D++;
      document.getElementById('status').textContent = "It's a draw!";
      render();
    } else {
      current = current === 'X' ? 'O' : 'X';
      render();
    }
  }

  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('click', () => handleClick(+cell.dataset.i));
  });

  document.getElementById('btn-restart').addEventListener('click', init);

  init();
</script>
</body>
</html>
